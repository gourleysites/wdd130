<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home Page and the rafting company name</title>
        <meta name="description" content="Adam Gourley, WDD130, Developing a website for White Water Rafting.">
        <meta name="author" content="Adam Gourley">
        <link rel="stylesheet" href="styles/rafting.css">
    </head>
    <body>
        <header>
            <img src="images/wwr-logo.png" alt="Whitewater Rafting logo with a splash of water behind" width="200">
            <nav class="navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <div class="homepage-hero">
                <img src="images/wwr-homepage-image.jpg" alt="Group of people on a raft splashing through some water" width="200">
                <h1>Come Make a Splash</h1>
            </div>
            <form>
                <div class="form-section">
                    <h2>Sign up for the newsletter</h2>
                    <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-item column2">
                    <label for="emailaddress">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" required>
                    <button type="submit">Subscribe</button>
                    </div>
                </div>
                <div class="form-section">
                    <h2>Plan your next trip with us</h2>
                    
                </div>
            </form>
        </main>
         <footer class="footer-text">
            <p>&copy;2026 🌊 Whitewater Rafting 🌊 Adam Gourley</p>
            <nav class="socialmedia">
                <a href="https://www.instagram.com">
                    <img src="images/instagram-icon.png" alt="Instagram Icon" width="50">
                </a>    
                <a href="https://www.facebook.com">
                    <img src="images/facebook-icon.png" alt="Facebook Icon" width="50">
                </a>
                <a href="https://www.youtube.com">
                    <img src="images/youtube-icon.png" alt="Youtube Icon" width="50">
                </a>
            </nav>
        </footer>
    </body>
</html>
