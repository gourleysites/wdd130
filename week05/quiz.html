<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>HTML and CSS Online Quiz</title>
        <meta name="description" content="An online quiz about HTML and CSS">
        <meta name="author" content="Adam Gourley">
        <link rel="stylesheet" href="styles/quizz.css">
    </head>
    <body>
        <h1>Basic HTML and CSS Quiz</h1>
        <main>
            <form>
                <h2>1.</h2>
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
                <h3>2.</h3>
                <label for="q2">How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="3" required></textarea>
                <h4>3.</h4>
                <label for="q3">Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="incorrect">/* ... /* ... */</option>
                    <option value="correct">/* ... */</option>
                    <option value="incorrect">// ... //</option>
                </select>
                <h5>4.</h5>
                <label for="q4">What is the bottom margin given this declaration?</label>
                <p>margin: 10px 5px 15px;</p>
                <input type="text" id="q4" name="q4" required>
                <button type="submit">Submit Quiz</button>
            </form>
        </main>
    </body>
</html>
