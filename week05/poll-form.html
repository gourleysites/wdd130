<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Poll Form</title>
        <meta name="description" content="Learning how to make forms">
        <meta name="author" content="Adam Gourley">
        <link rel="stylesheet" href="styles/poll-form.css">
    </head>
    <body>
        <header>
            <p>WDD 130 | HTML Form - User Poll</p>
        </header>
        <main>
            <form>
                <div class="form-section">
                    <h1>Contact Information</h1>
                    <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-item column2">
                    <label for="emailaddress">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" required>
                    </div>
                </div>
                <div class="form-section">
                    <h2>Questions</h2>
                    <div class="form-item column1">
                    <label for="browser">What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="other">Other</option>
                    </select>
                    </div>
                    <div class="form-item column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                    </div>
                    <label for="feedback">List the places you have lived:</label>
                    <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                </div>
                <button type="submit">Submit Poll</button>
            </form>
        </main>
        <footer>
            <p>&copy;2026 🦊 Adam Gourley 🦊 Utah, United States</p>
        </footer>
    </body>
</html>
